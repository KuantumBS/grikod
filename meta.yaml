{% set version = "1.1.8" %}

package:
  name: grikod
  version: {{ version }}  # ← Jinja2 değişkeni kullanın, sabit değer değil

source:
  path: .  # Yerel kaynak kodunun dizinini belirtin
  # url ve sha256 satırlarını tamamen kaldırın (path kullanıldığında gerekmez)

build:
  noarch: python
  script: python -m pip install --ignore-installed .
  number: 0

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
    - setuptools_scm
  run:
    - python

about:
  home: https://github.com/KuantumBS/grikod
  license: MIT
  summary: 'Binary to Gray code conversion package.'
  description: |
    Binary to Gray code conversion package.
  dev_url: https://github.com/KuantumBS/grikod
  doc_url: https://github.com/KuantumBS/grikod
  doc_source_url: https://github.com/KuantumBS/grikod/blob/main/README.md
